name: Instagram Daily Snapshots

on:
  schedule:
    # 11:00 UTC = 08:00 em Maceio
    - cron: "0 11 * * *"

  workflow_dispatch:

jobs:
  capture-instagram-snapshots:
    name: Capture Instagram snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call AprovUp snapshot endpoint
        env:
          CRON_SECRET: ${{ secrets.INSTAGRAM_CRON_SECRET }}

        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "INSTAGRAM_CRON_SECRET nao configurado no GitHub."
            false
          fi

          echo "Testando resolucao IPv4..."
          getent ahostsv4 aprovup.com.br || true

          echo ""
          echo "Chamando rotina de snapshots do AprovUp via IPv4..."

          response=$(curl \
            -4 \
            --http1.1 \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 4 \
            --retry-delay 5 \
            --retry-max-time 110 \
            --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://aprovup.com.br/api/cron/instagram-snapshots")

          echo ""
          echo "Resposta do AprovUp:"
          echo "$response"

          echo "$response" | grep -q '"ok":true'

          echo ""
          echo "Snapshots concluídos com sucesso."

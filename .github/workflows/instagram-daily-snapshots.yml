name: Instagram Daily Snapshots

on:
  schedule:
    # 11:00 UTC = 08:00 em Maceio
    - cron: "0 11 * * *"

  workflow_dispatch:

jobs:
  capture-instagram-snapshots:
    name: Capture Instagram snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call AprovUp snapshot endpoint
        env:
          CRON_SECRET: ${{ secrets.INSTAGRAM_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "INSTAGRAM_CRON_SECRET nao configurado no GitHub."
            exit 1
          fi

          echo "Chamando rotina de snapshots do AprovUp..."

          response=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://aprovup.com.br/api/cron/instagram-snapshots")

          echo "$response"

          echo "$response" | grep -q '"ok":true'

          echo "Snapshots concluídos com sucesso."
